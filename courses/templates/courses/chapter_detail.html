<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kapitel {{ chapter.number }} - {{ chapter.title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; }
        .badge { background: #28a745; color: white; padding: 5px 10px; border-radius: 5px; font-size: 14px; }
        .content-box { background: #eef2f7; padding: 20px; border-radius: 8px; margin-top: 20px; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #0056b3; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 16px; }
        button:hover { background: #004085; }
        .alert { background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <span class="badge">{{ chapter.level }}</span>
    <h1>Kapitel {{ chapter.number }}: {{ chapter.title }}</h1>
    
    <div class="content-box">
        <h3>Dars nazariyasi:</h3>
    </div>{{ chapter.grammar_content }}</div>div>
    </div>

    <hr style="margin: 30px 0;">

    <h2>Übungsbuch (Uyga vazifa yuborish)</h2>
    
    {% if success %}
        <div class="alert">Uyga vazifangiz muvaffaqiyatli yuborildi! O'qituvchi tekshiruvidan so'ng baho qo'yiladi.</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label for="submission">Vazifangiz matnini bera yozing:</label>
        <textarea name="submission" placeholder="Ich heiße... Ich komme aus..." required></textarea>
        <button type="submit">Vazifani topshirish</button>
    </form>
</div>

</body>
</html>
